title: Non-Standard Process Accessing LSASS
id: 3d4e5f6a-7b8c-4d9e-a1b2-c3d4e5f6a7b8
status: experimental
description: Detects processes other than known system tools accessing lsass.exe — credential dumping indicator.
tags:
  - attack.credential_access
  - attack.t1003.001
level: critical
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    # Only flag high-privilege access masks indicating potential memory dumping
    # These masks must contain PROCESS_VM_READ (0x0010) or PROCESS_ALL_ACCESS (0x1FFFFF)
    GrantedAccess:
      - '0x1010'  # PROCESS_VM_READ | PROCESS_QUERY_LIMITED_INFORMATION (Mimikatz default, ProcDump)
      - '0x1410'  # PROCESS_VM_READ | PROCESS_QUERY_INFORMATION | PROCESS_QUERY_LIMITED_INFORMATION
      - '0x1438'  # PROCESS_VM_READ | PROCESS_VM_WRITE | PROCESS_VM_OPERATION etc.
      - '0x143a'  # PROCESS_VM_READ | PROCESS_VM_WRITE | PROCESS_VM_OPERATION | PROCESS_CREATE_THREAD etc.
      - '0x1400'  # PROCESS_VM_READ | PROCESS_QUERY_INFORMATION
      - '0x1f0fff' # PROCESS_ALL_ACCESS (Standard Mimikatz)
      - '0x1fffff' # PROCESS_ALL_ACCESS (Standard/fallback)
  filter:
    SourceImage|endswith:
      # Known legitimate Windows/system binaries that access LSASS
      - '\lsass.exe'       # LSASS accessing itself
      - '\svchost.exe'     # Service Host
      - '\wininit.exe'     # Windows Initialization Process
      - '\csrss.exe'       # Client Server Runtime Process
      - '\MsMpEng.exe'     # Windows Defender Antimalware Service
      - '\ServiceHost.exe' # Local system service host
      - '\winlogon.exe'    # Windows Logon Application
      - '\services.exe'    # Services Control Manager
      - '\LsaIso.exe'      # Credential Guard Isolation Process
      - '\sihost.exe'      # Shell Infrastructure Host
      - '\taskhostw.exe'   # Host Process for Windows Tasks
      - '\spoolsv.exe'     # Print Spooler
      - '\msiexec.exe'     # Windows Installer
  condition: selection and not filter