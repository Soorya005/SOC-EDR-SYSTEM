title: Suspicious PowerShell Encoded Command
id: f9a3c8b2-1234-5678-abcd-ef0123456789
status: stable
level: high
description: Detects encoded PowerShell commands that may indicate obfuscation
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc'
      - '-e '
  condition: selection
tags:
  - attack.execution
  - attack.t1059.001
falsepositives:
  - Legitimate admin scripts